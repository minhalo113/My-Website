# Prevent bots from scanning for configuration files and sensitive data
# Returns 444 (Connection Closed Without Response) to save bandwidth and reduce log noise

location ~* \.(yaml|bak|cfg|php|env|sql|log|sh|ini)$ {
    return 444;
}

# Block access to hidden files and directories (except .well-known)
location ~ /\.(?!well-known) {
    return 444;
}
